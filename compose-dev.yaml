# See README.md, "Development data updates", for setup and usage.
services:
  api:
    build:
      context: .
      args:
        VERSION: ${VERSION}
        IS_DEV_ENV: "true"
    environment:
      # Dummy AWS credentials, don't need to use real ones
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_DEFAULT_REGION: us-east-2
      THERAPY_NORM_DB_URL: http://therapy-dynamodb-local:8000
      DISEASE_NORM_DB_URL: http://disease-dynamodb-local:8000
      UMLS_API_KEY: ${UMLS_API_KEY:?set UMLS_API_KEY}
      HARVARD_DATAVERSE_API_KEY: ${HARVARD_DATAVERSE_API_KEY:?set HARVARD_DATAVERSE_API_KEY}
      HEMONC_GUESTBOOK_PROJECT_NAME: ${HEMONC_GUESTBOOK_PROJECT_NAME:?set HEMONC_GUESTBOOK_PROJECT_NAME}
      HEMONC_GUESTBOOK_EMAIL: ${HEMONC_GUESTBOOK_EMAIL:?set HEMONC_GUESTBOOK_EMAIL}
      HEMONC_GUESTBOOK_USAGE_DESCRIPTION: ${HEMONC_GUESTBOOK_USAGE_DESCRIPTION:?set HEMONC_GUESTBOOK_USAGE_DESCRIPTION}
      WAGS_TAILS_DIR: /home/appuser/.local/share/wags_tails
    volumes:
      - type: bind
        source: ${WAGS_TAILS_DIR:?set WAGS_TAILS_DIR to an existing absolute host data directory}
        target: /home/appuser/.local/share/wags_tails
        bind:
          create_host_path: false
    ports:
      - 127.0.0.1:8001:80

    depends_on:
      disease-dynamodb-local:
        condition: service_started
      therapy-dynamodb-local:
        condition: service_started
    command: ["/bin/bash", "/app/therapy-norm-update.sh"]

  therapy-dynamodb-local:
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/dynamodb_local_latest
    image: amazon/dynamodb-local:3.3.2
    environment:
      # Allow up to 4 GiB of Java heap to prevent out-of-memory errors during normalization scans.
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx4g"
    ports:
      - 127.0.0.1:8000:8000
    volumes:
      - therapy_norm_ddb_vol:/home/dynamodblocal/dynamodb_local_latest
    working_dir: /home/dynamodblocal

  disease-dynamodb-local:
    image: ghcr.io/cancervariants/disease-normalizer-ddb:2026-10-20
    ports:
      - 127.0.0.1:8002:8000

volumes:
  therapy_norm_ddb_vol:
    external: true
